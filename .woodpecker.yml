when:
  - event: [push, manual]
    branch: main

steps:
  - name: build-and-push
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NPM_TOKEN:
        from_secret: npm_token
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - printf '@matchmakerjs:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NPM_TOKEN" > /tmp/npmrc
      - echo "$REGISTRY_PASSWORD" | docker login localhost:5000 -u "$REGISTRY_USER" --password-stdin
      - docker build --platform linux/amd64 --secret id=npmrc,src=/tmp/npmrc -t localhost:5000/telah/notification-api:${CI_COMMIT_SHA:0:8} -t localhost:5000/telah/notification-api:latest .
      - docker push --all-tags localhost:5000/telah/notification-api
